[package]
name = "pisky"
version = "0.7.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "pisky"
crate-type = ["cdylib", "rlib"]

[env]
CARGO_NET_GIT_FETCH_WITH_CLI = { value = "true" }

[dependencies]
pyo3 = "0.28.0"
pyo3-bytes = "0.6.0"
bytes = "1.11.1"
disky = { git = "ssh://git@github.com/jonasrsv42/disky", features = ["parallel", "zstd", "random"]}
log = "0.4"
env_logger = "0.11.9"
nanoserde = "0.2"
